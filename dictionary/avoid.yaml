# STC 不推荐写法 v0.1（首批）
# 按真实 AI 中文输出中的出现次数排定先后。格式见 README.md。

- avoid: 必须 / 务必 / 一定要
  type: 强度词
  why: 规则里混用多个强度词，读者分不出哪条更重
  use: 应
  examples:
    - before: 提交前必须运行测试。
      after: 提交前应运行测试。
  profiles: [instruction]

- avoid: 我们
  type: 人称代词
  why: 读者不知道指哪一群人；文档被转发后更不清楚
  use: 写名称：公司名、团队名、品牌名
  examples:
    - before: 我们会在三个工作日内回复。
      after: 客服团队会在 3 个工作日内回复。
  profiles: [web-dev, document]

- avoid: 建议 / 最好 / 尽量
  type: 强度词
  why: 说不清是要求还是推荐，做不到时算不算违反也不清楚
  use: 宜
  examples:
    - before: 最好为每个函数写注释。
      after: 宜为每个公开函数写注释。
  profiles: [instruction]

- avoid: 不要 / 禁止 / 不得 / 严禁 / 切勿
  type: 强度词
  why: 同一个强度用了五种说法
  use: 不应
  examples:
    - before: 禁止直接修改生产数据库。
      after: 不应直接修改生产数据库。
  profiles: [instruction]

- avoid: 部分（表示数量时）
  type: 模糊量词
  why: 说不清是哪些、有多少
  use: 写出是哪些，或写出数量
  examples:
    - before: 部分用户无法登录。
      after: 使用旧版应用的 120 名用户无法登录。

- avoid: 相关
  type: 模糊量词
  why: 说不清具体指什么
  use: 写出具体的对象
  examples:
    - before: 请准备相关材料。
      after: 请准备营业执照和法人身份证。

- avoid: 优化 / 提升 / 改善（不带对象和数字时）
  type: 含糊动词
  why: 说不清改了什么、改了多少
  use: 写出改了什么，以及改动前后的数字
  examples:
    - before: 优化了页面性能。
      after: 页面加载时间从 3 秒缩短到 1 秒。

- avoid: 沉淀
  type: 行话
  why: 读者要先把行话翻译成具体动作才能理解
  use: 写具体动作：整理成文档、记录下来、做成模板
  examples:
    - before: 把这次的经验沉淀下来。
      after: 把这次的处理步骤整理成一份操作手册。

- avoid: 落地
  type: 行话
  why: 说不清到了哪一步：上线、执行还是交付
  use: 写具体状态：上线、开始执行、交付
  examples:
    - before: 新流程下周落地。
      after: 新流程下周一开始执行。

- avoid: 链路
  type: 行话
  why: 说不清是哪些环节
  use: 写流程或具体的环节
  examples:
    - before: 打通从下单到发货的链路。
      after: 下单后，系统自动生成发货单。

- avoid: 对齐
  type: 行话
  why: 说不清是确认、统一还是商定
  use: 写具体动作：确认、统一、商定
  examples:
    - before: 会前先对齐一下口径。
      after: 会前先统一对外的说法。

- avoid: 进行 + 动作名词
  type: 虚动词
  why: 句子变长，动作藏进了名词
  use: 直接写动词
  examples:
    - before: 对数据进行分析。
      after: 分析数据。

- avoid: 闭环
  type: 行话
  why: 说不清从哪一步到哪一步
  use: 写清流程的起点和终点
  examples:
    - before: 客户投诉要形成闭环。
      after: 每条客户投诉都应记录处理结果，并在 3 天内回复客户。

- avoid: 不是 X，而是 Y
  type: 口号句式
  why: 追求气势，没有说清实际是什么
  use: 直接写实际是什么；需要对比时拆成两句
  examples:
    - before: 交付的不是工具，而是结果。
      after: 交付物是每月一份数据报告和一份改进清单。

- avoid: 一些
  type: 模糊量词
  why: 说不清有多少
  use: 写数量，或列出具体内容
  examples:
    - before: 修复了一些问题。
      after: 修复了 3 个问题：导出失败、日期显示错误、搜索无结果。

- avoid: 大家
  type: 人称代词
  why: 说不清指哪些人
  use: 写具体对象
  examples:
    - before: 大家分的是同一块蛋糕。
      after: 各品牌分的是同一块蛋糕。
  profiles: [web-dev, document]

- avoid: 非常 / 极其 / 十分
  type: 程度词
  why: 读者不知道程度到底有多高
  use: 删掉，或写数字
  examples:
    - before: 处理速度非常快。
      after: 每个文件在 1 秒内处理完。

- avoid: 显著
  type: 程度词
  why: 说不清变化有多大
  use: 写变化前后的数字
  examples:
    - before: 错误率显著下降。
      after: 错误率从 5% 降到 1%。

- avoid: 大量
  type: 模糊量词
  why: 说不清有多少
  use: 写数量
  examples:
    - before: 收到大量反馈。
      after: 收到 320 条反馈。

- avoid: 你们
  type: 人称代词
  why: 说不清指读者本人还是读者所在的公司
  use: 写名称；界面上称呼用户用「你」
  examples:
    - before: 你们的账号已开通。
      after: 你的账号已开通。
  profiles: [web-dev, document]

- avoid: 对于……而言
  type: 翻译腔
  why: 外语长句直译留下的外壳，删掉后主语更清楚
  use: 删掉外壳，把对象写成主语
  examples:
    - before: 对于新用户而言，注册流程太长。
      after: 新用户觉得注册流程太长。

- avoid: 进一步
  type: 冗余
  why: 不说明下一步具体做什么
  use: 删掉，或写出具体做什么
  examples:
    - before: 进一步完善功能。
      after: 增加批量导出功能。

- avoid: 颗粒度
  type: 行话
  why: 读者要先翻译才懂
  use: 写细到哪一级：按天、按条、按人
  examples:
    - before: 报表的颗粒度要更细。
      after: 报表要按天统计，不按周统计。

- avoid: 大幅
  type: 程度词
  why: 说不清幅度
  use: 写幅度
  examples:
    - before: 成本大幅下降。
      after: 成本下降 40%。

- avoid: 开展 + 名词
  type: 虚动词
  why: 句子变长，动作藏进了名词
  use: 直接写动词
  examples:
    - before: 开展测试工作。
      after: 测试。

- avoid: 做出 / 作出 + 名词
  type: 虚动词
  why: 句子变长，动作藏进了名词
  use: 直接写动词
  examples:
    - before: 对配置作出调整。
      after: 调整配置。

- avoid: 底层逻辑
  type: 行话
  why: 说不清是原因、机制还是原则
  use: 写出具体的原因或机制
  examples:
    - before: 这个功能的底层逻辑是提升效率。
      after: 这个功能把 3 个步骤合成 1 个，每单节省约 2 分钟。

- avoid: 予以 / 加以 + 动作名词
  type: 虚动词
  why: 句子变长，读着像公文
  use: 直接写动词
  examples:
    - before: 对该问题予以解决。
      after: 解决这个问题。

- avoid: 打造
  type: 营销词
  why: 宣传用语，说不清具体做了什么
  use: 写具体动作：建、做、开发
  examples:
    - before: 打造全新的官网。
      after: 重新开发官网。

- avoid: 出错 / 异常（界面报错里）
  type: 含糊动词
  why: 用户不知道是什么失败了、接下来怎么办
  use: 写「失败」，加上原因和下一步
  examples:
    - before: 系统异常，请稍后再试。
      after: 保存失败：服务器暂时无法连接。1 分钟后重试。
  profiles: [web-dev]

- avoid: 实现 + 名词（实现增长、实现提升）
  type: 虚动词
  why: 说不清变化了多少
  use: 写出变化前后的数字
  examples:
    - before: 实现了销量的增长。
      after: 销量比上月增长 15%。

- avoid: 适当 / 必要时 / 视情况
  type: 模糊量词
  why: 读者不知道具体的标准或条件
  use: 写出具体的标准或触发条件
  examples:
    - before: 必要时通知负责人。
      after: 部署失败时，应通知项目负责人。

- avoid: 赋能
  type: 营销词
  why: 说不清具体做了什么
  use: 写出具体做了什么、让谁能做什么
  examples:
    - before: 用数据赋能销售团队。
      after: 销售团队每天早上收到前一天的线索报表。

- avoid: 随着……的发展
  type: 套话
  why: 开头铺垫，不增加信息
  use: 删掉，直接写事实
  examples:
    - before: 随着 AI 技术的发展，越来越多的人用 AI 搜索。
      after: 用 AI 搜索的人在增加。

- avoid: 抓手
  type: 行话
  why: 说不清是手段、工具还是指标
  use: 写出具体的手段或工具
  examples:
    - before: 找到提升复购的抓手。
      after: 找出能提高复购率的做法，比如购买 30 天后发提醒。

- avoid: 在……的背景下
  type: 套话
  why: 开头铺垫，不增加信息
  use: 删掉，或直接写原因
  examples:
    - before: 在行业竞争加剧的背景下，公司调整了价格。
      after: 公司下调价格 10%，原因是同类产品降价。

- avoid: 助力
  type: 营销词
  why: 说不清起了什么作用
  use: 写出具体效果
  examples:
    - before: 助力企业降本增效。
      after: 每月节省约 20 小时人工整理时间。

- avoid: 一站式
  type: 营销词
  why: 说不清包含哪些功能
  use: 列出包含的功能
  examples:
    - before: 一站式营销服务。
      after: 内容制作、发布、数据分析三项服务。

- avoid: 极致
  type: 营销词
  why: 说不清达到了什么水平
  use: 删掉，或写指标
  examples:
    - before: 极致的加载速度。
      after: 页面在 1 秒内加载完成。

- avoid: 若干
  type: 模糊量词
  why: 说不清有多少
  use: 写数量
  examples:
    - before: 发现若干问题。
      after: 发现 4 个问题。

- avoid: 无缝
  type: 营销词
  why: 说不清怎么衔接
  use: 写清怎么衔接
  examples:
    - before: 与现有系统无缝对接。
      after: 现有系统的数据每小时自动同步一次，不用手动导入。

- avoid: 值得注意的是 / 需要注意的是 / 需要指出的是
  type: 套话
  why: 删掉后意思不变
  use: 删掉；确有风险时按风险提示的规则写
  examples:
    - before: 值得注意的是，旧版本不支持该功能。
      after: 旧版本不支持该功能。

- avoid: 一定程度上
  type: 程度词
  why: 说不清程度
  use: 删掉，或写具体程度
  examples:
    - before: 新方案在一定程度上降低了成本。
      after: 新方案让成本下降 8%。

- avoid: 起到……的作用
  type: 虚动词
  why: 句子变长，说不清具体作用
  use: 直接写具体作用
  examples:
    - before: 备份起到了保护数据的作用。
      after: 备份能防止数据丢失。

- avoid: 综上所述 / 总的来说
  type: 套话
  why: 删掉后意思不变
  use: 删掉，直接写结论；结论宜放在开头
  examples:
    - before: 综上所述，方案 A 更合适。
      after: 方案 A 更合适：成本低 20%，上线快 2 周。

- avoid: 众所周知
  type: 套话
  why: 不增加信息；读者未必知道
  use: 删掉，必要时给出处
  examples:
    - before: 众所周知，移动端流量已超过电脑端。
      after: 移动端流量占 68%（数据来源：网站统计后台，近 30 天）。

- avoid: 全方位
  type: 营销词
  why: 说不清是哪些方面
  use: 列出具体方面
  examples:
    - before: 全方位提升服务质量。
      after: 缩短响应时间，增加夜间客服。

- avoid: 成功地 / 有效地
  type: 冗余
  why: 不增加信息
  use: 删掉
  examples:
    - before: 成功地上传了文件。
      after: 文件已上传。

- avoid: 基于……的情况下
  type: 翻译腔
  why: 外语长句直译留下的结构
  use: 改成「如果……」或「在……时」
  examples:
    - before: 基于网络正常的情况下，同步需要 5 分钟。
      after: 如果网络正常，同步需要 5 分钟。
